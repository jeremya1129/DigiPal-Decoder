        Set(varSE_Spruce, ColorValue("#005F6D"));  // Deep Professional Green [5]
        Set(varSE_Blue, ColorValue("#42B4E6"));    // Informational Blue [3]
        Set(varSE_White, ColorValue("#FFFFFF"));   // Neutral Background
        Set(varSE_Black, ColorValue("#000000"));   // Text and Borders

